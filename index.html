    --bg:#0f0f13; --panel:#17171d; --panel2:#1c1c24; --border:#2a2a33;
    --text:#e7e5e0; --muted:#89858f; --accent:#ffb545; --accent-dim:#4a3a1e;
    --html:#ff8a65; --css:#5eb8ff; --js:#ffe066; --asset:#b48eff; --live:#5fd97a;
    --mono:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Consolas,monospace;
    --ui:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  header{
    display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;
    padding:.7rem .9rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;
  }
  .header-title{display:flex;align-items:center;gap:.5rem;flex:1 1 100%;min-width:0}
  header h1{font-size:.95rem;font-weight:700;margin:0;letter-spacing:.01em}
  .live{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--muted);flex-shrink:0}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 6px var(--live)}
  .save-status{font-size:.7rem;color:var(--muted);flex-shrink:0;opacity:0;transition:opacity .4s}
  .header-actions{display:flex;align-items:center;gap:.5rem;flex:1 1 100%;justify-content:space-between}
  .btn{
    font-family:var(--ui);font-size:.78rem;font-weight:600;color:var(--text);
    background:var(--panel2);border:1px solid var(--border);border-radius:7px;
    padding:.4rem .65rem;cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .btn:active{background:var(--border)}
  .btn.primary{background:var(--accent);color:#221703;border-color:var(--accent)}
  .toggle{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
  .toggle button{
    font-family:var(--ui);font-size:.78rem;font-weight:600;color:var(--muted);
    background:transparent;border:none;padding:.4rem .7rem;cursor:pointer;white-space:nowrap;
  }
  .toggle button.active{background:var(--accent);color:#221703}

  @media (min-width:640px){
    .header-title{flex:0 1 auto}
    .header-actions{flex:0 0 auto;margin-left:auto}
  }

  .files{
    display:flex;gap:.4rem;padding:.55rem .7rem;overflow-x:auto;flex-shrink:0;
    border-bottom:1px solid var(--border);background:var(--bg);
  }
  .file-chip{
    display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.76rem;
    background:var(--panel);border:1px solid var(--border);border-radius:7px;
    padding:.35rem .55rem;cursor:pointer;flex-shrink:0;color:var(--muted);
  }
  .file-chip.active{border-color:var(--accent);color:var(--text);background:var(--panel2)}
  .file-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .file-chip .del{color:var(--muted);font-size:.85rem;padding-left:.15rem}
  .file-chip .del:active{color:#ff6b6b}
  .file-chip.add{color:var(--accent);border-style:dashed}
  .file-chip.add.danger{color:#ff8a80;border-color:#5a2a2a}
  .file-chip.asset{cursor:default}
  .folder-label{
    display:flex;align-items:center;font-size:.72rem;color:var(--muted);
    padding:0 .2rem;flex-shrink:0;white-space:nowrap;
  }

  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .pane{flex:1;display:none;min-height:0;flex-direction:column}
  .pane.active{display:flex}
  .pane-head{
    display:flex;align-items:center;gap:.5rem;padding:.45rem .8rem;
    background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .pane-head .fname{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
  .pane-head select{
    font-family:var(--mono);font-size:.76rem;background:var(--panel2);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:.3rem .4rem;margin-left:auto;
  }
  textarea{
    flex:1;width:100%;resize:none;border:none;outline:none;
    background:var(--bg);color:var(--text);font-family:var(--mono);
    font-size:.85rem;line-height:1.55;padding:.9rem;tab-size:2;
  }
  iframe{flex:1;width:100%;border:none;background:#fff}

  @media (min-width:860px){
    .toggle{display:none}
    main{flex-direction:row}
    .pane{display:flex !important;flex:1;min-width:0}
    .pane#codePane{border-right:1px solid var(--border)}
  }

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:1rem;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    width:100%;max-width:320px;padding:1.1rem;
  }
  .modal h2{margin:0 0 .8rem;font-size:.95rem}
  .modal input{
    width:100%;font-family:var(--mono);font-size:.85rem;color:var(--text);
    background:var(--bg);border:1px solid var(--border);border-radius:7px;
    padding:.55rem .6rem;outline:none;
  }
  .modal input:focus{border-color:var(--accent)}
  .modal .err{color:#ff8a80;font-size:.74rem;min-height:1.1rem;margin-top:.4rem}
  .modal .hint{color:var(--muted);font-size:.72rem;margin-top:.4rem}
  .modal .row{display:flex;gap:.5rem;margin-top:.8rem;justify-content:flex-end}

  .autocomplete{
    position:fixed;z-index:40;background:var(--panel2);border:1px solid var(--border);
    border-radius:8px;overflow-y:auto;max-height:220px;min-width:160px;max-width:260px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);display:none;
  }
  .autocomplete .opt{
    font-family:var(--mono);font-size:.82rem;padding:.55rem .7rem;cursor:pointer;
    color:var(--text);display:flex;justify-content:space-between;gap:.5rem;min-height:1.6rem;align-items:center;
  }
  .autocomplete .opt small{color:var(--muted);font-family:var(--ui)}
  .autocomplete .opt.sel{background:var(--accent-dim)}
</style>
</head>
<body>
<header>
  <div class="header-title">
    <h1>HTML MASTER EDITOR</h1>
    <span class="live"><span class="dot"></span>LIVE</span>
    <span class="save-status" id="saveStatus"></span>
  </div>
  <div class="header-actions">
    <div class="toggle" id="viewToggle">
      <button data-v="code" class="active">Código</button>
      <button data-v="preview">Vista</button>
    </div>
    <button class="btn primary" id="downloadBtn">Descargar</button>
  </div>
</header>

<div class="files" id="fileRow"></div>
<input type="file" id="assetInput" accept="image/*,.pdf,.svg,.ico,.txt,.json,.csv,.woff,.woff2,.mp3,.mp4,.wav,.webm" multiple style="display:none">
<input type="file" id="importInput" multiple style="display:none">
<input type="file" id="importFolderInput" multiple webkitdirectory style="display:none">

<main>
  <section class="pane active" id="codePane">
    <div class="pane-head">
      <span class="fname" id="activeFileName">index.html</span>
      <button class="btn" id="formatBtn" style="margin-left:auto">✨ Formatear</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>
  <section class="pane" id="previewPane">
    <div class="pane-head">
      <span class="fname">Vista previa</span>
      <select id="previewSelect"></select>
    </div>
    <iframe id="preview" title="preview"></iframe>
  </section>
</main>

<div class="overlay" id="fileOverlay">
  <div class="modal">
    <h2>Nuevo archivo</h2>
    <input id="fileNameInput" placeholder="about.html, css/theme.css, paginas/menu.html…" autocomplete="off">
    <p class="hint">Usa "carpeta/archivo.html" para crear una subcarpeta.</p>
    <div class="err" id="fileNameErr"></div>
    <div class="row">
      <button class="btn" id="fileCancelBtn">Cancelar</button>
      <button class="btn primary" id="fileCreateBtn">Crear</button>
    </div>
  </div>
</div>

<div class="overlay" id="clearOverlay">
  <div class="modal">
    <h2>¿Borrar todo el proyecto?</h2>
    <p class="hint">Se perderán todos los archivos, imágenes y documentos, incluido lo guardado en este dispositivo. No se puede deshacer.</p>
    <div class="row">
      <button class="btn" id="clearCancelBtn">Cancelar</button>
      <button class="btn primary" id="clearConfirmBtn" style="background:#ff6b6b;border-color:#ff6b6b;color:#2a0000">Borrar todo</button>
    </div>
  </div>
</div>

<div class="autocomplete" id="autocomplete"></div>

<script>
const typeColor = {html:'var(--html)', css:'var(--css)', js:'var(--js)'};
const detectType = name => {
  if(name.endsWith('.css')) return 'css';
  if(name.endsWith('.js')) return 'js';
  return 'html';
};

let files = [
  {name:'index.html', content:
`<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi página</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hola mundo!</h1>
  <p>Edita este archivo y mira los cambios al instante.</p>
  <button id="btn">Haz clic</button>
  <script src="script.js"><\/script>
</body>
</html>`},
  {name:'style.css', content:
`body {
  font-family: sans-serif;
  background: #fdf6ec;
  color: #2a2a33;
  text-align: center;
  padding: 3rem 1rem;
}
h1 { color: #e0663a; }
button {
  margin-top: 1rem;
  padding: .6rem 1.2rem;
  border: none;
  border-radius: 8px;
  background: #2a2a33;
  color: #fff;
  font-size: 1rem;
}`},
  {name:'script.js', content:
`document.getElementById('btn').addEventListener('click', () => {
  alert('Funciona!');
});`}
];
let assets = []; // imágenes y documentos: [{name, dataUrl}]
let activeIndex = 0;

function nameTaken(name){
  const n = name.toLowerCase();
  return files.some(f => f.name.toLowerCase() === n) || assets.some(a => a.name.toLowerCase() === n);
}
function folderOf(name){ const i = name.lastIndexOf('/'); return i === -1 ? '' : name.slice(0, i); }
function baseNameOf(name){ const i = name.lastIndexOf('/'); return i === -1 ? name : name.slice(i + 1); }

const fileRow = document.getElementById('fileRow');
const editor = document.getElementById('editor');
const activeFileName = document.getElementById('activeFileName');
const previewSelect = document.getElementById('previewSelect');
const previewFrame = document.getElementById('preview');

function save(){ files[activeIndex].content = editor.value; scheduleAutoSave(); }

function renderFiles(){
  fileRow.innerHTML = '';
  const groups = {};
  files.forEach((f, i) => (groups[folderOf(f.name)] = groups[folderOf(f.name)] || []).push({kind:'file', i}));
  assets.forEach((a, i) => (groups[folderOf(a.name)] = groups[folderOf(a.name)] || []).push({kind:'asset', i}));
  const folderNames = Object.keys(groups).sort((a,b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));

  folderNames.forEach(folder => {
    if(folder){
      const label = document.createElement('div');
      label.className = 'folder-label';
      label.textContent = '📁 ' + folder;
      fileRow.appendChild(label);
    }
    groups[folder].forEach(entry => {
      if(entry.kind === 'file'){
        const i = entry.i, f = files[i], t = detectType(f.name);
        const chip = document.createElement('div');
        chip.className = 'file-chip' + (i===activeIndex ? ' active' : '');
        chip.title = f.name;
        chip.innerHTML = `<span class="dot" style="background:${typeColor[t]}"></span><span>${baseNameOf(f.name)}</span><span class="del">✕</span>`;
        chip.querySelector('span:nth-child(2)').onclick = () => selectFile(i);
        chip.querySelector('.dot').onclick = () => selectFile(i);
        chip.querySelector('.del').onclick = (e) => { e.stopPropagation(); deleteFile(i); };
        fileRow.appendChild(chip);
      } else {
        const i = entry.i, a = assets[i];
        const chip = document.createElement('div');
        chip.className = 'file-chip asset';
        chip.title = a.name + ' — imagen o documento: usa su nombre en src="" o href=""';
        chip.innerHTML = `<span class="dot" style="background:var(--asset)"></span><span>${baseNameOf(a.name)}</span><span class="del">✕</span>`;
        chip.querySelector('.del').onclick = (e) => { e.stopPropagation(); deleteAsset(i); };
        fileRow.appendChild(chip);
      }
    });
  });

  const add = document.createElement('div');
  add.className = 'file-chip add';
  add.textContent = '+ archivo';
  add.onclick = addFile;
  fileRow.appendChild(add);

  const addAsset = document.createElement('div');
  addAsset.className = 'file-chip add';
  addAsset.textContent = '+ imagen/doc';
  addAsset.onclick = () => assetInput.click();
  fileRow.appendChild(addAsset);

  const importBtn = document.createElement('div');
  importBtn.className = 'file-chip add';
  importBtn.textContent = '⭱ importar';
  importBtn.onclick = () => importInput.click();
  fileRow.appendChild(importBtn);

  const importFolderBtn = document.createElement('div');
  importFolderBtn.className = 'file-chip add';
  importFolderBtn.textContent = '📁 importar carpeta';
  importFolderBtn.onclick = () => importFolderInput.click();
  fileRow.appendChild(importFolderBtn);

  const clearBtn = document.createElement('div');
  clearBtn.className = 'file-chip add danger';
  clearBtn.textContent = '🗑 borrar todo';
  clearBtn.onclick = openClearModal;
  fileRow.appendChild(clearBtn);

  const htmlFiles = files.filter(f => detectType(f.name)==='html');
  previewSelect.innerHTML = htmlFiles.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
}

function selectFile(i){
  save();
  activeIndex = i;
  editor.value = files[i].content;
  activeFileName.textContent = files[i].name;
  renderFiles();
}

function deleteFile(i){
  if(files.length <= 1) return;
  files.splice(i,1);
  if(activeIndex >= files.length) activeIndex = files.length - 1;
  selectFile(activeIndex);
  updatePreview();
  scheduleAutoSave();
}

function deleteAsset(i){
  assets.splice(i,1);
  renderFiles();
  updatePreview();
  scheduleAutoSave();
}

const assetInput = document.getElementById('assetInput');
assetInput.addEventListener('change', () => {
  importFileList(assetInput.files, true);
  assetInput.value = '';
});

const importInput = document.getElementById('importInput');
const importFolderInput = document.getElementById('importFolderInput');
function importFileList(fileList, forceAsset){
  Array.from(fileList || []).forEach(f => {
    let name = (f.webkitRelativePath && f.webkitRelativePath.length) ? f.webkitRelativePath : f.name;
    while(nameTaken(name)){
      const dot = name.lastIndexOf('.');
      name = dot > -1 ? `${name.slice(0,dot)}-2${name.slice(dot)}` : name + '-2';
    }
    const isCode = !forceAsset && /\.(html?|css|js)$/i.test(name);
    const reader = new FileReader();
    reader.onload = () => {
      if(isCode) files.push({name: name.replace(/\.htm$/i, '.html'), content: reader.result});
      else assets.push({name, dataUrl: reader.result});
      renderFiles();
      updatePreview();
      scheduleAutoSave();
    };
    if(isCode) reader.readAsText(f);
    else reader.readAsDataURL(f);
  });
}
importInput.addEventListener('change', () => { importFileList(importInput.files, false); importInput.value = ''; });
importFolderInput.addEventListener('change', () => { importFileList(importFolderInput.files, false); importFolderInput.value = ''; });

const fileOverlay = document.getElementById('fileOverlay');
const fileNameInput = document.getElementById('fileNameInput');
const fileNameErr = document.getElementById('fileNameErr');

function addFile(){
  fileNameInput.value = '';
  fileNameErr.textContent = '';
  fileOverlay.classList.add('open');
  setTimeout(() => fileNameInput.focus(), 30);
}
function closeFileModal(){ fileOverlay.classList.remove('open'); }

function createFileFromModal(){
  const name = fileNameInput.value.trim();
  if(!name){ fileNameErr.textContent = 'Escribe un nombre.'; return; }
  if(!/\.(html|css|js)$/i.test(name)){ fileNameErr.textContent = 'Debe terminar en .html, .css o .js'; return; }
  if(nameTaken(name)){ fileNameErr.textContent = 'Ese nombre ya existe.'; return; }
  const t = detectType(name);
  const starter = t==='html' ? '<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="UTF-8">\n  <title>Nueva página</title>\n</head>\n<body>\n  \n</body>\n</html>' : '';
  files.push({name, content: starter});
  save();
  closeFileModal();
  selectFile(files.length - 1);
  updatePreview();
}

document.getElementById('fileCreateBtn').addEventListener('click', createFileFromModal);
document.getElementById('fileCancelBtn').addEventListener('click', closeFileModal);
fileOverlay.addEventListener('click', (e) => { if(e.target === fileOverlay) closeFileModal(); });
fileNameInput.addEventListener('keydown', (e) => { if(e.key==='Enter') createFileFromModal(); if(e.key==='Escape') closeFileModal(); });

function resolveAssets(text){
  assets.forEach(a => {
    const esc = a.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // src="foto.png" / href="foto.png" (con o sin ./ delante)
    const attrRe = new RegExp('(src|href)(\\s*=\\s*)(["\'])(?:\\./)?' + esc + '\\3', 'gi');
    text = text.replace(attrRe, (m, attr, eq, q) => `${attr}${eq}${q}${a.dataUrl}${q}`);
    // url(foto.png) / url("foto.png") en CSS
    const urlRe = new RegExp('url\\(\\s*([\'"]?)(?:\\./)?' + esc + '\\1\\s*\\)', 'gi');
    text = text.replace(urlRe, (m, q) => `url(${q}${a.dataUrl}${q})`);
  });
  return text;
}

function buildPreview(entryName){
  const entry = files.find(f => f.name === entryName) || files.find(f => detectType(f.name)==='html');
  if(!entry) return '<p style="font-family:sans-serif;padding:2rem;color:#888">No hay ningún archivo HTML.</p>';
  let html = entry.content;
  // quitar <link rel=stylesheet> y <script src=...> propios para no duplicar, e inyectar todo el CSS y JS
  html = html.replace(/<link[^>]+rel=["']stylesheet["'][^>]*>/gi, '');
  html = html.replace(/<script[^>]+src=["'][^"']*["'][^>]*>\s*<\/script>/gi, '');
  html = resolveAssets(html);
  const css = resolveAssets(files.filter(f => detectType(f.name)==='css').map(f => f.content).join('\n'));
  const js = files.filter(f => detectType(f.name)==='js').map(f => f.content).join('\n');
  const htmlNames = files.filter(f => detectType(f.name)==='html').map(f => f.name);
  const styleTag = `<style>${css}</style>`;
  const scriptTag = `<script>${js}<\/script>`;
  // navegación entre las páginas del propio proyecto: intercepta clics en <a href="otro.html">
  // para cambiar la vista previa al archivo virtual correspondiente, en vez de que el iframe
  // intente cargar una URL real (que no existe y produce 404). Los href ya resueltos a data:
  // (imágenes/documentos subidos) se dejan pasar de largo y se abren/descargan normalmente.
  const navScript = `<script>(function(){
  var HTML_FILES = ${JSON.stringify(htmlNames)};
  function norm(h){ h = h.split('#')[0].split('?')[0]; h = h.replace(/^\\.?\\/+/, ''); return h.toLowerCase(); }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if(!a) return;
    var href = a.getAttribute('href');
    if(!href || href.charAt(0) === '#') return;
    if(/^[a-z][a-z0-9+.\\-]*:/i.test(href)) return; // externos, mailto:, tel:, data: (imágenes/docs) se comportan normal
    if(a.target === '_blank') return;
    var target = norm(href);
    var match = HTML_FILES.find(function(n){ return n.toLowerCase() === target; });
    e.preventDefault();
    if(match) window.parent.postMessage({source:'html-master-editor', type:'navigate', file: match}, '*');
  });
  })();<\/script>`;
  if(html.includes('</head>')) html = html.replace('</head>', styleTag + '</head>');
  else html = styleTag + html;
  if(html.includes('</body>')) html = html.replace('</body>', scriptTag + navScript + '</body>');
  else html += scriptTag + navScript;
  return html;
}

window.addEventListener('message', (e) => {
  if(e.data && e.data.source === 'html-master-editor' && e.data.type === 'navigate'){
    if(files.some(f => f.name === e.data.file)){
      previewSelect.value = e.data.file;
      updatePreview();
    }
  }
});

let debounceT;
function updatePreview(){
  clearTimeout(debounceT);
  debounceT = setTimeout(() => {
    const target = previewSelect.value || (files.find(f=>detectType(f.name)==='html')||{}).name;
    previewFrame.srcdoc = buildPreview(target);
  }, 250);
}

function currentWord(){
  const val = editor.value, pos = editor.selectionStart;
  const before = val.slice(0, pos);
  const m = before.match(/[a-zA-Z0-9_.\-!:@]*$/);
  const word = m ? m[0] : '';
  return {word, start: pos - word.length, end: pos};
}

function caretPixelPos(){
  const div = document.createElement('div');
  const cs = getComputedStyle(editor);
  ['fontFamily','fontSize','lineHeight','padding','border','width','whiteSpace','wordWrap','boxSizing','letterSpacing'].forEach(p => div.style[p] = cs[p]);
  div.style.position = 'absolute'; div.style.visibility = 'hidden'; div.style.top = '-9999px';
  div.style.whiteSpace = 'pre-wrap'; div.style.wordWrap = 'break-word';
  div.textContent = editor.value.slice(0, editor.selectionStart);
  const marker = document.createElement('span'); marker.textContent = '\u200b';
  div.appendChild(marker);
  document.body.appendChild(div);
  const rect = editor.getBoundingClientRect();
  const top = rect.top + marker.offsetTop - editor.scrollTop + parseFloat(cs.paddingTop);
  const left = rect.left + marker.offsetLeft - editor.scrollLeft + parseFloat(cs.paddingLeft);
  document.body.removeChild(div);
  return {top, left};
}

const acBox = document.getElementById('autocomplete');
let acItems = [], acSel = 0, acRange = {start:0, end:0};

function hideAutocomplete(){ acBox.style.display = 'none'; acItems = []; }

function showAutocomplete(){
  const {word, start, end} = currentWord();
  if(word.length < 1){ hideAutocomplete(); return; }
  const type = detectType(files[activeIndex].name);
  const list = DICT[type] || [];
  const matches = list.filter(w => w.toLowerCase().startsWith(word.toLowerCase()) && w.toLowerCase() !== word.toLowerCase())
    .sort((a,b) => a.length - b.length).slice(0,10);
  if(matches.length === 0){ hideAutocomplete(); return; }
  acItems = matches; acSel = 0; acRange = {start, end};
  const pos = caretPixelPos();
  acBox.style.top = (pos.top + 22) + 'px';
  acBox.style.left = Math.min(pos.left, window.innerWidth - 250) + 'px';
  renderAutocomplete();
}

function renderAutocomplete(){
  acBox.innerHTML = acItems.map((w,i) => `<div class="opt${i===acSel?' sel':''}" data-i="${i}">${w}</div>`).join('');
  acBox.style.display = 'block';
  acBox.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('mousedown', (e) => { e.preventDefault(); acceptAutocomplete(parseInt(el.dataset.i)); });
  });
}

function acceptAutocomplete(i){
  const word = acItems[i];
  const {start, end} = acRange;
  editor.value = editor.value.slice(0, start) + word + editor.value.slice(end);
  // si el fragmento trae un hueco vacío (comillas o paréntesis), el cursor entra ahí
  // para escribir el contenido directamente (ej. href="" -> cursor entre las comillas)
  const hole = word.match(/""|''|\(\)/);
  const newPos = hole ? start + hole.index + 1 : start + word.length;
  editor.selectionStart = editor.selectionEnd = newPos;
  hideAutocomplete();
  save(); updatePreview();
  editor.focus();
}
/* ---------- fin autocompletado ---------- */

/* ---------- cierre automático de etiquetas y pares (comillas/paréntesis) ---------- */
const VOID_TAGS = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
const PAIRS = { '"':'"', "'":"'", '(':')', '[':']', '{':'}' };
const CLOSERS = new Set(['"',"'",')',']','}']);

function autoCloseTag(){
  const pos = editor.selectionStart;
  const before = editor.value.slice(0, pos);
  const m = before.match(/<([a-zA-Z][a-zA-Z0-9-]*)((?:\s[^<>]*)?)>$/);
  if(!m) return;
  const tag = m[1].toLowerCase();
  const attrs = m[2] || '';
  if(VOID_TAGS.has(tag) || attrs.trim().endsWith('/')) return;
  const after = editor.value.slice(pos);
  if(after.startsWith('</' + tag + '>')) return;
  const closeTag = '</' + tag + '>';
  editor.value = editor.value.slice(0, pos) + closeTag + editor.value.slice(pos);
  editor.selectionStart = editor.selectionEnd = pos;
  save(); updatePreview();
}
/* ---------- fin cierre automático ---------- */

/* ---------- indentación automática (Enter sube/baja de nivel solo) ---------- */
function lineInfoAt(pos){
  const before = editor.value.slice(0, pos);
  const lastNl = before.lastIndexOf('\n');
  return { lineStart: lastNl + 1, lineText: before.slice(lastNl + 1) };
}

function handleSmartEnter(){
  const pos = editor.selectionStart;
  const val = editor.value;
  const before = val.slice(0, pos);
  const after = val.slice(pos);
  const { lineText } = lineInfoAt(pos);
  const indent = (lineText.match(/^[ \t]*/) || [''])[0];
  const trimmed = lineText.trim();
  const lastChar = trimmed.slice(-1);

  let deeper = false, closerRightHere = false;

  if(PAIRS[lastChar] && after.startsWith(PAIRS[lastChar])){
    deeper = true; closerRightHere = true;
  } else if(lastChar === '{' || lastChar === '[' || lastChar === '('){
    deeper = true;
  } else {
    // ¿la línea termina en una etiqueta HTML contenedora recién abierta?
    const m = trimmed.match(/<([a-zA-Z][a-zA-Z0-9-]*)((?:\s[^<>]*)?)>$/);
    if(m){
      const tag = m[1].toLowerCase();
      const attrs = m[2] || '';
      if(!VOID_TAGS.has(tag) && !attrs.trim().endsWith('/')){
        deeper = true;
        if(after.toLowerCase().startsWith('</' + tag + '>')) closerRightHere = true;
      }
    }
  }

  const extra = deeper ? '  ' : '';
  let insertion, cursorOffset;
  if(closerRightHere){
    insertion = '\n' + indent + extra + '\n' + indent;
    cursorOffset = 1 + (indent + extra).length;
  } else {
    insertion = '\n' + indent + extra;
    cursorOffset = insertion.length;
  }
  editor.value = before + insertion + after;
  editor.selectionStart = editor.selectionEnd = before.length + cursorOffset;
  save(); updatePreview();
}

function dedentBeforeCloser(key){
  const s0 = editor.selectionStart;
  if(editor.selectionEnd !== s0) return;
  const { lineStart, lineText } = lineInfoAt(s0);
  if(!/^[ \t]+$/.test(lineText)) return; // solo si la línea tiene únicamente espacios antes del cursor
  const reduced = lineText.slice(0, Math.max(0, lineText.length - 2));
  editor.value = editor.value.slice(0, lineStart) + reduced + editor.value.slice(s0);
  editor.selectionStart = editor.selectionEnd = lineStart + reduced.length;
}
/* ---------- fin indentación automática ---------- */

/* ---------- formateador de código (reordena etiquetas/bloques anidados en niveles) ---------- */
function formatHTML(src){
  const re = /<!--[\s\S]*?-->|<!DOCTYPE[^>]*>|<[^>]+>|[^<]+/gi;
  const raw = src.match(re) || [];
  const tokens = [];
  raw.forEach(t => {
    if(t.startsWith('<')) tokens.push({type:'tag', raw:t});
    else { const trimmed = t.trim(); if(trimmed) tokens.push({type:'text', raw:trimmed}); }
  });
  const lines = [];
  let depth = 0, i = 0;
  while(i < tokens.length){
    const tok = tokens[i];
    if(tok.type === 'text'){ lines.push({depth, text: tok.raw}); i++; continue; }
    const rawTag = tok.raw;
    if(rawTag.startsWith('<!--') || /^<!DOCTYPE/i.test(rawTag)){ lines.push({depth, text: rawTag}); i++; continue; }
    if(/^<\//.test(rawTag)){ depth = Math.max(0, depth-1); lines.push({depth, text: rawTag}); i++; continue; }
    const selfClose = /\/>\s*$/.test(rawTag);
    const nameMatch = rawTag.match(/^<([a-zA-Z][a-zA-Z0-9-]*)/);
    const tag = nameMatch ? nameMatch[1].toLowerCase() : '';
    const isVoid = VOID_TAGS.has(tag);
    if(selfClose || isVoid){ lines.push({depth, text: rawTag}); i++; continue; }
    const next1 = tokens[i+1], next2 = tokens[i+2];
    const closeRe = new RegExp('^</' + tag + '>$', 'i');
    if(next1 && next1.type === 'text' && next2 && next2.type === 'tag' && closeRe.test(next2.raw)){
      lines.push({depth, text: rawTag + next1.raw + next2.raw}); i += 3; continue;
    }
    if(next1 && next1.type === 'tag' && closeRe.test(next1.raw)){
      lines.push({depth, text: rawTag + next1.raw}); i += 2; continue;
    }
    lines.push({depth, text: rawTag}); depth++; i++;
  }
  return lines.map(l => '  '.repeat(l.depth) + l.text).join('\n');
}

function formatCSS(src){
  let out = '', depth = 0, buf = '', i = 0;
  const n = src.length;
  while(i < n){
    const ch = src[i];
    if(ch === '/' && src[i+1] === '*'){
      const end = src.indexOf('*/', i+2);
      const comment = end === -1 ? src.slice(i) : src.slice(i, end+2);
      if(buf.trim()){ out += '  '.repeat(depth) + buf.trim() + '\n'; buf=''; }
      out += '  '.repeat(depth) + comment.trim() + '\n';
      i = end === -1 ? n : end+2; continue;
    }
    if(ch === '{'){ out += '  '.repeat(depth) + buf.trim() + ' {\n'; depth++; buf=''; i++; continue; }
    if(ch === '}'){
      if(buf.trim()) out += '  '.repeat(depth) + buf.trim().replace(/;?$/, ';') + '\n';
      buf=''; depth = Math.max(0, depth-1); out += '  '.repeat(depth) + '}\n'; i++; continue;
    }
    if(ch === ';'){
      const decl = buf.trim().replace(/^([a-zA-Z-]+)\s*:\s*/, '$1: ');
      if(decl) out += '  '.repeat(depth) + decl + ';\n';
      buf=''; i++; continue;
    }
    buf += ch; i++;
  }
  if(buf.trim()) out += '  '.repeat(depth) + buf.trim().replace(/^([a-zA-Z-]+)\s*:\s*/, '$1: ') + '\n';
  return out.trim();
}

function formatJS(src){
  let out = '', depth = 0, parenDepth = 0, buf = '', i = 0;
  const n = src.length;
  function flush(){ const t = buf.trim(); if(t) out += '  '.repeat(depth) + t + '\n'; buf=''; }
  while(i < n){
    const ch = src[i];
    if(ch === '/' && src[i+1] === '/'){
      const end = src.indexOf('\n', i);
      const comment = end === -1 ? src.slice(i) : src.slice(i, end);
      flush(); out += '  '.repeat(depth) + comment.trim() + '\n';
      i = end === -1 ? n : end+1; continue;
    }
    if(ch === '/' && src[i+1] === '*'){
      const end = src.indexOf('*/', i+2);
      const comment = end === -1 ? src.slice(i) : src.slice(i, end+2);
      flush(); out += '  '.repeat(depth) + comment.trim() + '\n';
      i = end === -1 ? n : end+2; continue;
    }
    if(ch === '"' || ch === "'" || ch === '`'){
      const quote = ch; let j = i+1, str = ch;
      while(j < n){
        str += src[j];
        if(src[j] === '\\' && j+1 < n){ j++; str += src[j]; j++; continue; }
        if(src[j] === quote){ j++; break; }
        j++;
      }
      buf += str; i = j; continue;
    }
    if(ch === '('){ parenDepth++; buf += ch; i++; continue; }
    if(ch === ')'){ parenDepth = Math.max(0, parenDepth-1); buf += ch; i++; continue; }
    if(ch === '{'){ buf += ' {'; flush(); depth++; i++; continue; }
    if(ch === '}'){
      flush(); depth = Math.max(0, depth-1); buf = '}';
      let j = i+1;
      while(j<n && /[;,)]/.test(src[j])){ buf += src[j]; j++; }
      flush(); i = j; continue;
    }
    if(ch === ';' && parenDepth === 0){ buf += ';'; flush(); i++; continue; }
    if(ch === '\n'){ if(buf.trim()!=='') buf += ' '; i++; continue; }
    buf += ch; i++;
  }
  flush();
  return out.trim();
}

function formatCode(){
  const f = files[activeIndex];
  const type = detectType(f.name);
  let result;
  try{
    if(type === 'html') result = formatHTML(f.content);
    else if(type === 'css') result = formatCSS(f.content);
    else result = formatJS(f.content);
  }catch(err){ return; }
  if(!result) return;
  f.content = result;
  editor.value = result;
  editor.selectionStart = editor.selectionEnd = 0;
  updatePreview();
  scheduleAutoSave();
}
document.getElementById('formatBtn').addEventListener('click', formatCode);

editor.addEventListener('click', hideAutocomplete);

editor.addEventListener('keydown', (e) => {
  if(acItems.length && ['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){
    if(e.key === 'ArrowDown'){ e.preventDefault(); acSel = (acSel+1) % acItems.length; renderAutocomplete(); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); acSel = (acSel-1+acItems.length) % acItems.length; renderAutocomplete(); return; }
    if(e.key === 'Enter'){ e.preventDefault(); acceptAutocomplete(acSel); return; }
    if(e.key === 'Escape'){ hideAutocomplete(); return; }
  }
  if(e.key === 'Enter'){
    e.preventDefault();
    handleSmartEnter();
    return;
  }
  if(e.key === 'Tab'){
    e.preventDefault();
    if(acItems.length){ acceptAutocomplete(acSel); return; }
    const s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.slice(0,s) + '  ' + editor.value.slice(en);
    editor.selectionStart = editor.selectionEnd = s + 2;
    save(); updatePreview();
    return;
  }
  if(e.key === '}' || e.key === ']' || e.key === ')'){
    dedentBeforeCloser(e.key);
  }
  const s0 = editor.selectionStart, e0 = editor.selectionEnd;
  // saltar sobre el cierre si ya está justo ahí (ej. escribir " al lado de una " existente)
  if(CLOSERS.has(e.key) && s0 === e0 && editor.value[s0] === e.key){
    e.preventDefault();
    editor.selectionStart = editor.selectionEnd = s0 + 1;
    return;
  }
  // autocompletar el par al abrir comillas o paréntesis/corchetes/llaves
  if(PAIRS[e.key] && s0 === e0){
    e.preventDefault();
    editor.value = editor.value.slice(0,s0) + e.key + PAIRS[e.key] + editor.value.slice(e0);
    editor.selectionStart = editor.selectionEnd = s0 + 1;
    save(); updatePreview();
  }
});

/* ---------- generador de ZIP propio (sin dependencias externas) ---------- */
const CRC_TABLE = (() => {
  const table = [];
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
const u16 = n => [n & 0xff, (n >> 8) & 0xff];
const u32 = n => [n & 0xff, (n >> 8) & 0xff, (n >> 16) & 0xff, (n >> 24) & 0xff];

function dataUrlToBytes(dataUrl){
  const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function buildZip(items){
  const enc = new TextEncoder();
  const localParts = [], centralParts = [];
  let offset = 0;
  items.forEach(f => {
    const nameBytes = enc.encode(f.name);
    const data = f.bytes ? f.bytes : enc.encode(f.content);
    const crc = crc32(data);
    const dosTime = 0, dosDate = 0x21;
    const local = new Uint8Array([
      ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(dosTime), ...u16(dosDate),
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(nameBytes.length), ...u16(0),
      ...nameBytes, ...data
    ]);
    localParts.push(local);
    const central = new Uint8Array([
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(dosTime), ...u16(dosDate),
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(nameBytes.length), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(0), ...u32(offset),
      ...nameBytes
    ]);
    centralParts.push(central);
    offset += local.length;
  });
  const centralSize = centralParts.reduce((s,p) => s + p.length, 0);
  const centralOffset = offset;
  const end = new Uint8Array([
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(items.length), ...u16(items.length),
    ...u32(centralSize), ...u32(centralOffset), ...u16(0)
  ]);
  const total = new Uint8Array(offset + centralSize + end.length);
  let p = 0;
  localParts.forEach(part => { total.set(part, p); p += part.length; });
  centralParts.forEach(part => { total.set(part, p); p += part.length; });
  total.set(end, p);
  return total;
}
/* ---------- fin generador de ZIP ---------- */

document.getElementById('downloadBtn').addEventListener('click', () => {
  save();
  try{
    const items = files.map(f => ({name: f.name, content: f.content}))
      .concat(assets.map(a => ({name: a.name, bytes: dataUrlToBytes(a.dataUrl)})));
    const bytes = buildZip(items);
    const blob = new Blob([bytes], {type:'application/zip'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'proyecto.zip';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    const btn = document.getElementById('downloadBtn');
    const prev = btn.textContent;
    btn.textContent = 'Error, reintenta';
    setTimeout(() => btn.textContent = prev, 1800);
  }
});

/* ---------- guardado persistente (IndexedDB: aguanta reinicios del dispositivo) ---------- */
// Usamos IndexedDB en vez de localStorage porque los proyectos con imágenes/documentos
// pesan más de lo que localStorage permite (~5 MB) y esos guardados fallarían en silencio.
// IndexedDB persiste igual en el dispositivo, sin conexión, y no se borra al apagarlo.
const DB_NAME = 'html-master-editor-db';
const STORE = 'project';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if(!('indexedDB' in window)){ reject(new Error('sin IndexedDB')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
function showSaveStatus(text){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(showSaveStatus._t);
  showSaveStatus._t = setTimeout(() => { el.style.opacity = '0'; }, 1600);
}
async function saveProject(){
  try{
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ files, assets, savedAt: Date.now() }, 'current');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    showSaveStatus('· guardado');
  }catch(err){
    showSaveStatus('· sin guardar');
  }
}
async function loadProject(){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get('current');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(err){ return null; }
}
async function clearProjectStorage(){
  try{
    const db = await openDB();
    await new Promise((resolve) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete('current');
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  }catch(err){ /* nada que borrar */ }
}
let autoSaveTimer = null;
function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(saveProject, 800);
}
/* ---------- fin guardado persistente ---------- */

(async function init(){
  const saved = await loadProject();
  if(saved && Array.isArray(saved.files) && saved.files.length){
    files = saved.files;
    assets = Array.isArray(saved.assets) ? saved.assets : [];
    activeIndex = 0;
  }
  editor.value = files[activeIndex] ? files[activeIndex].content : '';
  activeFileName.textContent = files[activeIndex] ? files[activeIndex].name : '';
  renderFiles();
  updatePreview();
})();

// Registro del Service Worker para instalacion como PWA y uso sin conexion.
// Solo funciona cuando el archivo se sirve por HTTPS (o localhost) junto a sw.js,
// por ejemplo al publicarlo en GitHub Pages. Al abrirlo como archivo local (file://)
// esta parte se ignora de forma silenciosa y el editor sigue funcionando igual.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
